<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Awesome Virtual Cell 2026 | Frontier Papers & Benchmarks</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="A curated registry of frontier papers, benchmarks, and world models for Virtual Cells, Single-Cell Perturbation Dynamics, and Foundation Models.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Modern Clean Theme with Dark/Light Support -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #2563eb;
      --sidebar-width: 280px;
      --content-max-width: 1050px;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0b0f19;
        color: #e2e8f0;
      }
    }
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.92rem;
    }
    .markdown-section table th, .markdown-section table td {
      padding: 10px 14px;
      border: 1px solid rgba(120, 130, 150, 0.2);
    }
    .markdown-section table th {
      background-color: rgba(37, 99, 235, 0.08);
      font-weight: 600;
    }
    .sidebar {
      background-color: #0f172a;
      color: #94a3b8;
    }
    .sidebar-nav a {
      color: #cbd5e1;
    }
    .sidebar-nav a:hover {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div id="app">Loading Awesome Virtual Cell 2026...</div>
  
  <!-- Mermaid -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });
    window.mermaid = mermaid;
  </script>

  <script>
    window.$docsify = {
      name: 'Awesome Virtual Cell 2026',
      repo: 'zwYang2004/Awesome-Virtual-Cell-2026',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      coverpage: false,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 Search papers, datasets, methods...',
        noData: 'No matching papers found!',
        depth: 4
      },
      copyCode: {
        buttonText : '📋 Copy',
        errorText  : 'Error',
        successText: '✓ Copied'
      },
      pagination: {
        previousText: 'Previous Section',
        nextText: 'Next Section',
        crossChapter: true
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return (
                '<div class="mermaid">' + code + "</div>"
              );
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            if (window.mermaid) {
              window.mermaid.run({
                querySelector: '.mermaid'
              });
            }
          });
        }
      ]
    }
  </script>
  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Copy to Clipboard Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Zoom Image Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <!-- Pagination -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>
</html>
