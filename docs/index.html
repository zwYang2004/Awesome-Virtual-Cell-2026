<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Awesome Virtual Cell 2026 | Research Hub</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="A curated registry of frontier papers, benchmarks, and world models for Virtual Cells, Single-Cell Perturbation Dynamics, and Foundation Models.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Clean Academic Documentation Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    :root {
      --base-font-size: 14.5px;
      --base-line-height: 1.65;
      --base-font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --theme-color: #1d4ed8;
      --sidebar-width: 270px;
      --content-max-width: 1040px;
      
      /* Pure Academic Clean Light Palette */
      --body-background: #ffffff;
      --body-color: #1e293b;
      --heading-color: #0f172a;
      --link-color: #1d4ed8;
      --link-color--hover: #1e40af;
      
      /* Sidebar */
      --sidebar-background: #f8fafc;
      --sidebar-border-color: #e2e8f0;
      --sidebar-name-color: #0f172a;
      --sidebar-name-font-weight: 700;
      --sidebar-nav-link-color: #334155;
      --sidebar-nav-link-color--active: #1d4ed8;
      --sidebar-nav-link-font-weight--active: 600;
      
      /* Tables */
      --table-border-color: #e2e8f0;
      --table-head-background: #f8fafc;
      --table-head-color: #0f172a;
      --table-row-background--stripe: #fcfdfe;
      
      /* Code */
      --code-inline-background: #f1f5f9;
      --code-inline-color: #0f172a;
      --code-block-background: #f8fafc;
      --code-block-color: #1e293b;
    }

    body {
      background-color: #ffffff !important;
      color: #1e293b !important;
      font-family: var(--base-font-family);
      -webkit-font-smoothing: antialiased;
      line-height: var(--base-line-height);
    }

    .sidebar {
      background-color: #f8fafc !important;
      border-right: 1px solid #e2e8f0;
    }
    
    .sidebar-nav strong {
      color: #475569;
      font-size: 0.80rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 1rem;
      display: inline-block;
    }

    .sidebar-nav a {
      color: #334155 !important;
      font-size: 0.88rem;
      padding: 4px 0;
    }

    .sidebar-nav a:hover, .sidebar-nav li.active > a {
      color: #1d4ed8 !important;
      font-weight: 600;
    }

    /* Academic Headings */
    h1 {
      font-size: 1.85rem !important;
      font-weight: 700 !important;
      color: #0f172a !important;
      letter-spacing: -0.02em;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 0.5rem;
      margin-top: 1.5rem !important;
    }

    h2 {
      font-size: 1.35rem !important;
      font-weight: 600 !important;
      color: #0f172a !important;
      letter-spacing: -0.01em;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 0.4rem;
      margin-top: 2rem !important;
    }

    h3 {
      font-size: 1.10rem !important;
      font-weight: 600 !important;
      color: #1e293b !important;
    }

    /* Structured Academic Tables */
    .markdown-section table {
      display: table !important;
      width: 100% !important;
      border-collapse: collapse;
      margin: 1.2rem 0;
      background: #ffffff;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    .markdown-section table th, .markdown-section table td {
      padding: 9px 12px;
      border: 1px solid #e2e8f0;
      font-size: 0.86rem;
      line-height: 1.5;
    }

    .markdown-section table th {
      background-color: #f8fafc !important;
      color: #0f172a !important;
      font-weight: 600;
      text-align: left;
    }

    .markdown-section table tr:nth-child(even) {
      background-color: #fbfcfe;
    }

    /* Mermaid Architecture & Timelines: Clean Light Background */
    .mermaid {
      background: #ffffff;
      padding: 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      margin: 1.2rem 0;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }

    /* Remove distracting outline */
    .markdown-section p img {
      margin: 2px 2px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="app">Loading documentation...</div>
  
  <!-- Mermaid -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({
      startOnLoad: false,
      theme: 'neutral',
      themeVariables: {
        fontFamily: '-apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif',
        fontSize: '12.5px',
        primaryColor: '#f8fafc',
        primaryBorderColor: '#64748b',
        primaryTextColor: '#0f172a',
        lineColor: '#64748b',
        secondaryColor: '#ffffff',
        tertiaryColor: '#ffffff',
        edgeLabelBackground: '#ffffff'
      }
    });
    window.mermaid = mermaid;
  </script>

  <script>
    window.$docsify = {
      name: 'Awesome Virtual Cell 2026',
      repo: 'zwYang2004/Awesome-Virtual-Cell-2026',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      coverpage: false,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search papers, benchmarks, methods...',
        noData: 'No matching entries found',
        depth: 4
      },
      copyCode: {
        buttonText : 'Copy',
        errorText  : 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return (
                '<div class="mermaid">' + code + "</div>"
              );
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            if (window.mermaid) {
              window.mermaid.run({
                querySelector: '.mermaid'
              });
            }
          });
        }
      ]
    }
  </script>
  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Copy to Clipboard Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Zoom Image Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <!-- Pagination -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>
</html>
