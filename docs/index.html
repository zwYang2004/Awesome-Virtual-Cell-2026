<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Awesome Virtual Cell 2026 | Frontier Research Registry</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="A curated registry of frontier papers, benchmarks, and world models for Virtual Cells, Single-Cell Perturbation Dynamics, and Foundation Models.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Clean Academic Documentation Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    :root {
      --base-font-size: 15px;
      --base-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --theme-color: #2563eb;
      --sidebar-width: 290px;
      --content-max-width: 1080px;
      
      /* Pure Academic Clean Light Palette */
      --body-background: #ffffff;
      --body-color: #1e293b;
      --heading-color: #0f172a;
      --link-color: #2563eb;
      --link-color--hover: #1d4ed8;
      
      /* Sidebar */
      --sidebar-background: #f8fafc;
      --sidebar-border-color: #e2e8f0;
      --sidebar-name-color: #0f172a;
      --sidebar-name-font-weight: 700;
      --sidebar-nav-link-color: #334155;
      --sidebar-nav-link-color--active: #2563eb;
      --sidebar-nav-link-font-weight--active: 600;
      
      /* Tables */
      --table-border-color: #e2e8f0;
      --table-head-background: #f1f5f9;
      --table-head-color: #0f172a;
      --table-row-background--stripe: #f8fafc;
      
      /* Code & Badges */
      --code-inline-background: #f1f5f9;
      --code-inline-color: #0f172a;
      --code-block-background: #f8fafc;
      --code-block-color: #1e293b;
    }

    /* Force Clean Academic Light Styling */
    body {
      background-color: #ffffff !important;
      color: #1e293b !important;
      font-family: var(--base-font-family);
      -webkit-font-smoothing: antialiased;
    }

    .sidebar {
      background-color: #f8fafc !important;
      border-right: 1px solid #e2e8f0;
    }
    
    .sidebar-nav strong {
      color: #0f172a;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .sidebar-nav a {
      color: #334155 !important;
      font-size: 0.92rem;
    }

    .sidebar-nav a:hover, .sidebar-nav li.active > a {
      color: #2563eb !important;
      font-weight: 600;
    }

    /* Modern Academic Tables */
    .markdown-section table {
      display: table !important;
      width: 100% !important;
      border-collapse: collapse;
      margin: 1.5rem 0;
      background: #ffffff;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    .markdown-section table th, .markdown-section table td {
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      font-size: 0.90rem;
      line-height: 1.5;
    }

    .markdown-section table th {
      background-color: #f1f5f9 !important;
      color: #0f172a !important;
      font-weight: 600;
      text-align: left;
    }

    .markdown-section table tr:nth-child(even) {
      background-color: #f8fafc;
    }

    /* Mermaid Diagrams: Crisp Academic Contrast */
    .mermaid {
      background: #ffffff;
      padding: 1.2rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin: 1.5rem 0;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }

    /* Badges alignment */
    .markdown-section p img {
      margin: 2px 2px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="app">Loading Awesome Virtual Cell 2026...</div>
  
  <!-- Mermaid -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({
      startOnLoad: false,
      theme: 'neutral',
      themeVariables: {
        fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
        fontSize: '13px',
        primaryColor: '#eff6ff',
        primaryBorderColor: '#3b82f6',
        primaryTextColor: '#1e293b',
        lineColor: '#64748b',
        secondaryColor: '#f8fafc',
        tertiaryColor: '#ffffff',
        edgeLabelBackground: '#ffffff'
      }
    });
    window.mermaid = mermaid;
  </script>

  <script>
    window.$docsify = {
      name: 'Awesome Virtual Cell 2026',
      repo: 'zwYang2004/Awesome-Virtual-Cell-2026',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      coverpage: false,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 Search papers, datasets, methods...',
        noData: 'No matching papers found!',
        depth: 4
      },
      copyCode: {
        buttonText : '📋 Copy',
        errorText  : 'Error',
        successText: '✓ Copied'
      },
      pagination: {
        previousText: 'Previous Section',
        nextText: 'Next Section',
        crossChapter: true
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return (
                '<div class="mermaid">' + code + "</div>"
              );
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {
            if (window.mermaid) {
              window.mermaid.run({
                querySelector: '.mermaid'
              });
            }
          });
        }
      ]
    }
  </script>
  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Copy to Clipboard Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Zoom Image Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <!-- Pagination -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>
</html>
